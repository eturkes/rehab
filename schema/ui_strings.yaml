  en: "Each cell is the uncertainty reduction a single observed measure gives over the admission-only baseline (regression = PI half-width reduction; AIS = APS set shrink), each calibrated by its own single-add head's marginal conformal; rows are ordered by mean improvement."
methods_per_outcome_heading:
