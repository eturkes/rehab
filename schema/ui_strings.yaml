# --- overview ---
overview_lead_title:
  ja: "このコホートにみる回復の実際"
  en: "What recovery looks like in this cohort"
overview_lead_deck:
  ja: "主要所見は4件。全患者・絞り込みなしで算出し、下のフィルターでは変わらない。"
  en: "Four findings, computed on every patient with no filters — the filters below never change them."
overview_lead_note_summary:
  ja: "数値の種類と読み方の前提を開く"
  en: "Open the ground rules for reading these numbers"
overview_lead_note:
  ja: "数値には2種類ある。実測割合は診療録に記録された事象の集計値である。ホールドアウト推定値は学習に使用していない患者で測定したモデルの成績であり、未学習の患者に対する性能の推定値にあたる。対象患者の条件は所見ごとに異なるため、各所見の「測定の詳細」に母数・測定内容・図の読み方・解釈を制限する条件を明記している。いずれも単一施設のデータに基づく所見であり、因果効果を示すものではない。外部集団での検証は行っていない。"
  en: "Two kinds of number appear. Observed rates are counts taken from the clinical record. Held-out model estimates are measured on patients withheld from training, and estimate how the model performs on patients it has not seen. Eligibility differs from one finding to the next, so each finding states its denominator, what was measured, how to read its figure, and the conditions that limit it inside “How this was measured”. All findings are based on data from one rehabilitation centre; none establishes a causal effect or has been validated in an external population."
overview_glance_ladder:
  ja: "退院時自立率はSCIM動作ごとに異なる"
  en: "Discharge independence rate varies by SCIM activity"
overview_glance_improve:
  ja: "改善は最高評価時点で {rate_best:.0%}、最終評価時点で {rate_last:.0%}"
  en: "Improvement is {rate_best:.0%} counted at best, {rate_last:.0%} at last"
overview_glance_measure:
  ja: "{measure}：{count}指標中R²点推定が最高"
  en: "{measure}: highest R² estimate of {count} tested"
overview_glance_certainty:
  ja: "80%予測区間（退院時SCIM）が{shrink:.0%}狭まる"
  en: "Discharge-SCIM 80% interval narrows by {shrink:.0%}"
overview_scope_years:
  ja: "事業年度"
  en: "Business years"
overview_finding_how_summary:
  ja: "測定の詳細 — 母数・図の読み方・解釈の制限"
  en: "How this was measured — denominator, reading, limits"
overview_finding_ladder_kicker:
  ja: "自立している患者はどれだけいるか"
  en: "How many patients are independent"
overview_finding_ladder_takeaway:
  ja: "合計点が同じでも自立している動作は異なりうるため、SCIM合計だけでは退院後にどの動作へ支援が要るかは読み取れない。"
  en: "Patients with the same summary score can differ in which activities are independent, so a SCIM total alone cannot say which supports a patient will still need after discharge."
overview_finding_ladder_scope:
  ja: "SCIM-III の {count} 動作それぞれについて、退院時に自立していた患者の割合 · {n} 名"
  en: "Share of patients independent at discharge, for each of {count} SCIM-III activities · {n} patients"
overview_finding_ladder_title:
  ja: "移動は自立している患者が最も少なく、セルフケアは最も多い"
  en: "Mobility is where the fewest patients are independent, self-care where the most are"
overview_finding_ladder_reading:
  ja: "1本の棒が SCIM-III で採点される1つの日常生活動作にあたり、棒の長さは退院日にその動作を自立して行えていた患者の割合を示す。自立率の順に並べると尺度が「はしご」になり、最下段は「{low_item}」の {low:.0%}、最上段は「{high_item}」の {high:.0%} である。棒の色は動作の領域を表すため、どの領域がはしごのどこに位置するかも読み取れる。本コホートでは下段を移動・移乗の項目が占め、最も多くの患者が到達しているのは身の回り動作の項目である。個々の棒よりも、この開きの大きさが本所見の要点である。食事や整容が自立していても屋外移動や階段昇降には介助を要する例があり、SCIM 合計点のみでは、退院後にどの動作でどの支援が必要になるかは特定できない。はしごは「どの動作が退院までに自立に至りにくいか」という難易度の順位であり、回復の順序ではない。いずれも退院時点の断面の割合であり、1人の患者が自立を取り戻す順序については情報を持たない。個々の棒は、その動作単独での退院時点の見込みとして読む。"
  en: "Each bar is one activity of daily living scored on the SCIM-III, and its length is the share of patients who performed that activity independently on the day of discharge. Sorted by rate, the bars form a ladder running from {low_item} at the bottom, reached by {low:.0%} of patients, to {high_item} at the top, reached by {high:.0%}. Bar colour marks the domain, so the chart also shows where each domain sits on the ladder: in this cohort the ambulation and transfer items occupy the bottom, and the activities reached by the most patients are self-care items. The spread across activities, rather than any single bar, is the finding. A patient who is independent in eating and grooming may still require assistance to walk outdoors or climb stairs, so a single summary SCIM score does not identify which supports that patient will need after discharge. The ladder is a difficulty ranking, that is, which activities the fewest patients had regained by discharge, and not a recovery sequence: these are all discharge-day rates and carry no information about the order in which an individual patient regains activities. An individual bar is the discharge-time prospect for that single activity."
overview_finding_ladder_excluded:
  ja: "なお、SCIM-III の項目でありながらはしごに描かれていないものがある。「{item}」は退院時に {rate:.0%}（{n} 名中）が自立しておりほぼ全例に達するため、項目別モデルの対象から外してある。この項目は記録された人数が他項目と異なるため、母数もはしごの {n_ladder} 名とは一致しない。"
  en: "One SCIM-III activity is scored but absent from the ladder: {item} reaches independence in {rate:.0%} of the {n} patients who record it at discharge, a rate high enough that the item was excluded from the per-item models. It is recorded for a different set of patients, so that denominator does not match the ladder's {n_ladder}."
overview_finding_ladder_excluded_ceiling:
  ja: "したがって図の上端である {high:.0%} は、SCIM-III の全項目を通じて最も高い自立率というわけではない。"
  en: "The top of the chart at {high:.0%} is therefore not the highest independence rate across all SCIM-III activities."
overview_finding_ladder_basis:
  ja: "母数は退院時に SCIM-III が記録されている {n} 名。採点は項目ごとに行われるため、ある項目の欠測はその項目の割合からのみ除かれ、項目間で母数は数名ずつ異なる。自立とは人的介助なしで当該動作を完遂できることを指し、装具・車椅子などの補助具の使用は自立を妨げるものとみなさない（車椅子使用者が移動項目で自立と判定されうるのはこのため）。いずれも退院時記録から数え上げた実測値であってモデル予測ではなく、本コホートが到達した水準を示すものであって、個々の患者が到達する水準を示すものではない。"
  en: "Denominator: {n} patients with a SCIM-III recorded at discharge. Items are scored one by one, so a missing score drops that patient from its own item only, and per-item denominators differ by a few. Independent means the patient completed the activity with no human assistance; aids, braces, wheelchairs and other devices are permitted and do not count against independence, so a wheelchair user can be independent in several mobility items. These are counts taken from the discharge record rather than model predictions, and they describe the level this cohort reached, not the level any individual patient will reach."
overview_finding_improve_kicker:
  ja: "AIS の改善はどれだけ持続するか"
  en: "How much AIS improvement holds"
overview_finding_improve_takeaway:
  ja: "この2つの割合は、時点の異なる2回の測定ではなく、同一のエピソードを2通りの規則で数えたものである。最高到達グレードは期間内の最大値であるため、最終評価時点のグレードを下回ることはない。また「改善」の到達先は入院時グレードによって異なり、入院時 AIS D では全髄節が正常な E への到達を要する。低下が現れる時期は6か月の期間全体に散らばっており、特定の一時点に集中してはいない。"
  en: "The two rates count the same episodes under two rules, not at two points in time: the best grade is the maximum anywhere in the window, so it can never sit below the last. Which grade counts as improvement also differs by admission grade — leaving AIS D requires reaching E, normal function in every segment. When a grade slips, it slips across the whole six months rather than at one moment the window could be watched for."
overview_finding_improve_scope:
  ja: "入院時・6か月以内の最高到達・最終評価時点の AIS グレード · {n} エピソード（入院時 A–D）"
  en: "AIS grade on admission, at its best within 6 months, and at the last assessment · {n} episodes admitted A–D"
overview_finding_improve_title:
  ja: "入院時グレードを上回ったエピソードは、6か月以内の最高評価時点で数えると {rate_best:.0%}、最終評価時点で数えると {rate_last:.0%} だった"
  en: "Counted at the best assessment within six months, {rate_best:.0%} of episodes had risen above their admission grade; counted at the last, {rate_last:.0%} had"
overview_finding_improve_reading:
  ja: "図は各エピソードを3列で追う。入院時のグレード、入院後6か月以内に記録された最高グレード、そして同じ期間内で最後に記録されたグレードである。第1列から第2列へ上がるリボンは、いずれかの時点で改善の閾値を越えた患者を表す。第2列から第3列へ下がる赤いリボンは、その最高グレードが最終記録時には保たれていなかった患者である。見出しの2つの割合はいずれも図中に数値として描かれていない。前者は第1列のうち第2列でより高いグレードへ上がる割合、後者は第3列でも入院時グレードを上回ったままの割合にあたる。改善ヘッドが予測するのは第1の到達であり、一度上がってから戻った患者もそこに数えられる。第2列と第3列の間には時期の目印が3つ置かれ、最高到達を下回った記録が初めて出た時期を示す。低下のあったリボンはその目印を通るため、リボンが折れる位置が時期を表す。赤は最終評価時点でも最高到達に戻っていないもの、橙は戻っていたものである。"
  en: "Each episode enters the figure three times: the grade it was admitted at, the best grade recorded anywhere in the first six months, and the last grade recorded in that window. A ribbon rising between the first two columns is a patient who met the improvement threshold at some point; a red ribbon between the second and third is one whose best grade was not the grade they were last recorded at. Neither headline rate is drawn as a number: the first is the share of the admission column that rises into a higher grade at the second, the second the share still standing above its admission grade at the third. The rate the improve head models is that first crossing, so a patient who rose and then returned is counted in it. Three time markers stand between the second and third columns, one for each part of the window; every episode ever recorded below its own peak passes through the marker for when that record first appeared, so the point at which a ribbon breaks is when the grade slipped. Red ribbons had not come back by the last assessment, amber ones had."
overview_finding_improve_basis:
  ja: "{n} エピソード。入院時 AIS A–D、実在の患者 ID を持ち、0日〜6か月の期間内に AIS 評価が2回以上あるものに限る。入院時グレードのみで再評価のないエピソードは数えないため、この割合は再評価を受けたことを条件とする。6か月より後に記録されたグレード、およびその時点で初めて記録された変化は期間外となる。最高到達を維持できなかった例の分布は入院時グレード間で一様ではなく、入院時 AIS {peak_grade} を上回った {peak_n_peaked} 件のうち {peak_n_fell} 件に対し、他の入院時グレードでは合計 {rest_n_peaked} 件中 {rest_n_fell} 件である。維持されなかった到達は、それ自体では機能が失われた証拠にはならない。A から B の境界は仙髄の所見ひとつで決まり、評価者間で最も食い違いやすい測定であるため、実際の不安定さと評価者間のばらつきの双方が赤いリボンに含まれる。最高到達を下回る記録は {n_dipped} 件にあり、うち {n_recovered} 件は最終評価時点までに戻っている。時期は記録された時点であって低下の起きた時点ではなく、実際には最後に最高到達が確認された評価とその記録の間のどこかで起きている。追跡期間の長さも効き、記録が2か月で終わるエピソードはそれ以降の低下を示しようがない。最終評価時点でも下回ったままの例では、初めて記録された時期の中央値は {median_day_fell} 日である。"
  en: "{n} episodes admitted at AIS A–D with a real patient identifier and at least two AIS assessments in the 0-day-to-6-month window; an episode carrying only an admission grade and no reassessment is not counted, so the rate is conditional on having been looked at again. Grades recorded after six months, and any change first recorded then, fall outside the window. Crossings that did not hold are spread unevenly across admission grades: {peak_n_fell} of the {peak_n_peaked} that rose above AIS {peak_grade}, against {rest_n_fell} of the {rest_n_peaked} from the other admission grades combined. A crossing that did not persist is not by itself evidence that function was lost: the A-to-B boundary turns on a single sacral finding, the measurement most exposed to disagreement between examinations, so both genuine instability and inter-rater variation land in the red ribbons. A record below the peak exists for {n_dipped} episodes, {n_recovered} of which were back at it by the last assessment. The marker holds when the drop was recorded, not when it happened: the loss sits somewhere between the last assessment that still showed the peak and the one that caught it, and follow-up length bounds what can be seen at all — an episode whose record ends at two months cannot show a later drop. Among those still below their peak at the last assessment, the median first record of it falls on day {median_day_fell}."
overview_finding_measure_kicker:
  ja: "3か月時点で測り直す価値が最も高い1指標"
  en: "The one measure worth repeating"
overview_finding_measure_takeaway:
  ja: "入院時情報のみのホールドアウトR²は{baseline:.2f}。3か月までの直近の{measure}を加えたモデルは{best:.2f}で、検証した{count}指標中もっとも高い点推定値だった。"
  en: "Admission-only held-out R² was {baseline:.2f}; adding the latest {measure} recorded by 3 months gave {best:.2f}, the highest point estimate among the {count} tested."
overview_finding_measure_scope:
  ja: "退院時SCIM合計に対するホールドアウト R² — 3か月時点の {count} 指標を1つずつ追加 · 検証 {n_test} 名"
  en: "Held-out R² for discharge SCIM total, adding each of {count} measures at 3 months in turn · {n_test} test patients"
overview_finding_measure_title:
  ja: "入院時情報のみのモデルに{count}指標をそれぞれ単独で加えると、ホールドアウトR²が最も高かったのは3か月までに記録された直近の{measure}だった"
  en: "Added on its own to the admission-only model, the latest {measure} recorded by 3 months gave the highest held-out R² of the {count} tested"
overview_finding_measure_reading:
  ja: "点線の基準線は、入院時情報だけを使ったモデルである。学習に使っていない患者での R² は {baseline:.2f}、すなわち退院時SCIM合計のばらつきのおよそ {baseline:.0%} を説明し、残りは説明できていない。各行はこの同じモデルに、指標をちょうど1つだけ加えて作り直したものである。加えるのは3か月時点までに記録された直近の値を持ち越したもので、最後の評価が6週時点の患者であればその6週時点の値が用いられる。予測対象・入院時の特徴量・検証用患者はいずれも共通であり、基準線から丸印までの距離が、その指標が3か月時点で得られていることによる説明力の増分にあたる。R² は説明できた分散の割合で、1.00 なら完全予測、0.00 なら全員にコホート平均値を当てはめるのと同等を意味する。したがってこの順位は、3か月時点で1指標のみを測り直す場合に、どの指標が退院時SCIM合計の予測をどれだけ改善するかを示す。本コホートでの最上位は{measure}の {best:.2f} であり、神経学的指標ではなく機能評価である。この比較を制限する条件は下記に示す。"
  en: "The dotted reference line is a model given admission data alone. On held-out patients it reaches an R² of {baseline:.2f}, meaning it accounts for roughly {baseline:.0%} of the variation in discharge SCIM total and leaves the rest unexplained. Each row repeats that same model with exactly one measure added: the most recent value of that measure recorded on or before the 3-month mark, carried forward, so a patient last examined at 6 weeks contributes that 6-week value. Everything else is held fixed, with the same outcome, the same admission features and the same held-out patients. The distance from the line to a marker is therefore the gain attributable to having that one measure available at 3 months. R² is the share of variance explained: 1.00 would be perfect prediction, and 0.00 would be equivalent to assigning every patient the cohort mean. The ranking thus indicates how much each measure would improve a discharge-SCIM prediction if it were the only measure repeated at 3 months. In this cohort the highest-ranked measure is a functional score, {measure} at {best:.2f}, rather than a neurological one. The conditions stated below bound that comparison."
overview_finding_measure_basis:
  ja: "母数は3か月時点でまだ在院していた {n} 名。3か月時点までの観測値を持ちうるのはこの群だけである。うち {n_test} 名がホールドアウト検証集合にあたり、ここに示した数値はすべてその集合で算出している。入院時情報のみの基準モデル（R²={baseline:.2f}）と {count} 個の単独追加モデルは、同一の患者・同一分割で学習し同一のホールドアウト患者で評価しているため、各行どうしも基準線との比較も成立する。読み方を制限する条件が2つある。第一に、SCIM の各下位尺度は予測対象と同一の尺度を2度測ったものであり、その優位性の一部は臨床情報の増分ではなく測定の重複に由来する。純粋に神経学的な評価と比べたい場合は、神経学的指標の最上位を基準にするのが妥当である。第二に、検証対象が {n_test} 名では信頼区間のない点推定しか得られず、指標間の優劣を検定してもいない。R² が数百分の一しか違わない指標どうしはこの数値からは区別できないため、細かい順位を序列として読むべきではない。"
  en: "Denominator: the {n} patients still admitted at the 3-month landmark, the only patients who can carry an on-or-before-3-month observation; {n_test} of them fall in the held-out test split that produced every number shown here. The admission-only reference model at R²={baseline:.2f} and the {count} single-measure models are all trained on the same patients with the same split and scored on the same held-out patients, so the rows are comparable with each other and with the reference line. Two conditions bound the reading. First, the SCIM subscales are the same instrument as the outcome, measured twice, so part of their advantage is measurement overlap rather than added clinical information; for a purely neurological examination the highest-ranked neurological measure is the more appropriate benchmark. Second, {n_test} test patients give point estimates with no confidence intervals and no test of whether one measure outperforms another, so measures separated by a few hundredths of R² cannot be distinguished from these numbers, and their exact order should not be read as a ranking."
overview_finding_measure_compare:
  ja: "なお、その神経学的指標の最上位は{other}で、R²={other_r2:.2f} である。"
  en: "For that purely neurological comparison the benchmark is {other}, the highest-ranked neurological measure, at R²={other_r2:.2f}."
overview_finding_certainty_kicker:
  ja: "経過観察で予測はどこまで確かになるか"
  en: "How much certainty observation buys"
overview_finding_certainty_takeaway:
  ja: "狭まりは時間の経過ではなく追加された測定によるものである。各時点で、同一の在院患者・同一分割で学習したモデル同士を比較している。"
  en: "The narrowing comes from the added measurements, not from time passing: at every landmark the two models are compared on the same still-admitted patients."
overview_finding_certainty_scope:
  ja: "退院時SCIM合計の80%予測区間の半幅（SCIM点）— 入院時情報のみと観測ありの比較 · {landmark} 時点 {n} 名"
  en: "Half-width of the 80% interval for discharge SCIM, with and without observation · {n} patients at {landmark}"
overview_finding_certainty_title:
  ja: "{landmark} までの測定値を加えると、退院時SCIMの80%予測区間は入院時情報のみより {shrink:.0%} 狭くなる"
  en: "The measurements recorded through {landmark} narrow the 80% interval for discharge SCIM by {shrink:.0%}"
overview_finding_certainty_reading:
  ja: "予測区間とは、その患者の退院時SCIM合計がこの範囲に入るとモデルが見込む幅であり、80%予測区間は100人中80人で真の値を含むように構成されている。図はその半幅、すなわち点推定に併記する ±値を、{first_landmark} から {landmark} までの各評価時点についてプロットしたものである。破線は入院時情報だけを使ったモデル、実線は同じ時点の同じモデルに、その時点までに記録された臨床測定値をすべて与えたものである。比較は同一時点内での縦方向で行い、その差が追加した観測による不確実性の減少にあたる。{landmark} 時点では ±{baseline_pi:.0f} と ±{observed_pi:.0f} SCIM点の差にあたる。横方向の比較は弱い。時点が進むほど患者は退院していくため、各時点はより小さく、より選択された在院患者群を記述しているからである。"
  en: "A prediction interval is the range within which the model expects a patient's discharge SCIM total to fall, and an 80% interval is constructed to contain the true value for 80 of every 100 patients. The chart plots its half-width, the ± value reported alongside a point prediction, at each landmark from {first_landmark} to {landmark}. The dashed line is a model working from admission data alone; the solid line is the same model at the same landmark, additionally given every clinical measurement recorded up to that point. The two lines are compared vertically, within a landmark: that gap is the reduction in uncertainty attributable to the added observations, and at {landmark} it is the difference between ±{baseline_pi:.0f} and ±{observed_pi:.0f} SCIM points. Comparison along the horizontal axis is weaker, because patients are discharged as the landmarks advance, so each landmark describes a smaller and more selected group of still-admitted patients."
overview_finding_certainty_basis:
  ja: "母数は各時点の在院リスク集合である。その時点でまだ在院していたという根拠がある患者のみを各時点に組み入れており、退院済みの患者が後続時点に混入することはない。{landmark} 時点の適格者は {n} 名、ホールドアウト検証集合は {first_landmark} の {n_first} 例から {landmark} の {n_last} 例へ減少する。各時点で入院時のみモデルと観測ありモデルは同一の患者・同一分割で学習しているため、縦方向の差は追加した観測に帰属し、時間経過や患者構成の変化によるものではない。点推定の精度も区間と同じ向きに動き、{landmark} 時点の退院時SCIM合計に対する R² は入院時のみで {baseline:.2f}、観測ありで {observed:.2f} である。"
  en: "Denominator: the still-admitted risk set at each landmark. A patient enters a landmark only with evidence of still being admitted then, which prevents discharged patients from entering later landmarks. {n} patients are eligible at {landmark}, and the held-out test split falls from {n_first} at {first_landmark} to {n_last} at {landmark}. At every landmark the admission-only and with-observation models are trained on the same patients with the same split, so the vertical gap is attributable to the added observations rather than to elapsed time or a shifting case mix. Point accuracy moves with the interval: R² for discharge SCIM total at {landmark} is {baseline:.2f} from admission data alone against {observed:.2f} with observation."
overview_finding_certainty_coverage:
  ja: "予測区間は分割共形予測により本コホートで較正しており、名目80%に対する {landmark} 時点のホールドアウト実測被覆率は入院時のみで {cov_baseline:.0%}、観測ありで {cov_observed:.0%} だった。いずれも内部ホールドアウトの推定値であり、外部集団での検証は行っていない。"
  en: "Intervals are split-conformal and calibrated on this cohort; against the nominal 80% they covered {cov_baseline:.0%} of held-out patients admission-only and {cov_observed:.0%} with observation at {landmark}. All of it is an internal held-out estimate, never checked against an external population."
overview_gradient_summary:
  ja: "上記すべての所見の背景にある、入院時重症度による退院時機能の勾配を開く"
  en: "Open the admission-severity gradient behind all four findings"
overview_gradient_basis:
  ja: "本コホートの退院時機能は、入院時にどれだけ運動機能が残っていたかによって強く階層化されている。この勾配が、上記4件の所見を読む際の背景にあたる。本パネルは、入院時 ISNCSCI 総運動スコア（0–100）と退院時SCIM合計の両方が記録されている {n} 名（うち {n_orphans} 件は患者 ID が記録されておらず重複を照合できないため、厳密には記録数である）を入院時スコアの四分位に分け、四分位ごとの退院時SCIM合計を示す。点は中央値、太線は第1四分位から第3四分位まで、すなわち各群の中央50%が収まる範囲である。群間の分離の大きさは Kruskal–Wallis 検定の順位ベース効果量 η²={effect:.2f} で表している。これは生の点数ではなく順位に対して算出した値であり、順位の上で四分位が強く分離することを示すものであって、退院時SCIM合計の生の分散の {effect:.0%} を説明するという意味ではない。隣接する四分位は大きく重なる。平均としての勾配は強い一方で、各四分位内の個々の転帰は広い範囲に散らばる。年齢・損傷高位・受傷機転・在院日数などを調整していない粗な関連であり、運動スコアが転帰に及ぼす因果効果ではない。"
  en: "Discharge function in this cohort is strongly graded by the amount of motor function present on admission, and that gradient is the background against which the four findings above should be read. This panel takes the {n} patients who have both an admission ISNCSCI Total Motor score (0–100) and a discharge SCIM total ({n_orphans} of those records carry no patient ID, so they cannot be checked for duplication and the count is strictly one of records), sorts them into quartiles of that admission score, and plots discharge SCIM total for each quartile: the point is the median and the thick range covers the middle half of the quartile, from the 25th to the 75th percentile. The separation is quantified by a Kruskal–Wallis rank effect size, η²={effect:.2f}, computed on the ranked outcomes rather than on the raw scores: it indicates that the quartiles separate strongly in rank order, and it is not a claim that {effect:.0%} of the raw variance in discharge SCIM total is explained. Neighbouring quartiles overlap substantially. The gradient is strong on average, and individual outcomes within each quartile remain widely spread. This is an unadjusted association, calculated without controlling for age, injury level, mechanism or length of stay, so it is not the causal effect of motor score on outcome."
