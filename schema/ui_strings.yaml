# --- methods ---
methods_outcome:
  ja: "主要アウトカム"
  en: "Primary outcome"
methods_outcome_def:
  ja: "本番アウトカムは11種: 退院時 SCIM-III 合計と3下位尺度、退院時 AIS、在院日数、および入院→退院のΔスコア5種。全体を通じた主要アウトカムは退院時 SCIM-III 合計 (0–100、高いほど ADL 自立度が高い)。"
  en: "Eleven production outcomes: discharge SCIM-III total and its three subscales, discharge AIS grade, length of stay, and five admission→discharge Δ-scores. The headline outcome throughout is discharge SCIM-III total (0–100; higher = more ADL independence)."
methods_model:
  ja: "モデル"
  en: "Model"
methods_model_def:
  ja: "アウトカムごとに1つの LightGBM ヘッド。スコア系はクォンタイル回帰 (10/50/90%) と分割共形較正による80%予測区間、退院時 AIS は較正済み多クラスヘッドと APS 予測集合。全ヘッドが同一の入院時特徴量と患者単位分割を共有する。"
  en: "One LightGBM head per outcome: quantile regression (10/50/90%) with split-conformal 80% intervals for the score outcomes, and a calibrated multiclass head with APS prediction sets for discharge AIS. All heads share the same admission features and patient-level split."
methods_features:
  ja: "特徴量"
  en: "Features"
methods_features_def:
  ja: "入院時 (0day) のみで取得される変数: 人口統計、損傷分類、AIS、NLI、UEMS/LEMS、感覚総和、ZPP、VAC/DAP、合併症 (糖尿病・OPLL・DISH)。"
  en: "Admission-only (day 0) variables: demographics, injury classification, AIS, NLI, UEMS/LEMS, sensory totals, ZPP, VAC/DAP, comorbidities (diabetes, OPLL, DISH)."
methods_split:
  ja: "データ分割"
  en: "Train / test split"
methods_split_def:
  ja: "患者単位のグループ分割: 80% 学習・20% テスト。クロスバリデーション (5-fold, GroupKFold)。"
  en: "Patient-level group split: 80% train / 20% test. 5-fold GroupKFold cross-validation."
methods_explainability:
  ja: "説明可能性"
  en: "Explainability"
methods_explainability_def:
  ja: "TreeSHAP によるグローバル・ローカル説明。連続量にはパーシャル依存も併用。"
  en: "TreeSHAP for global & local explanations; partial dependence for continuous features."
methods_subgroup:
  ja: "サブグループ解析"
  en: "Subgroup analysis"
methods_subgroup_def:
  ja: "Mann-Whitney U / Kruskal-Wallis H 検定と効果量 (Cliff's δ / Cohen's d)。FDR 補正済み。"
  en: "Mann-Whitney U / Kruskal-Wallis H tests with effect sizes (Cliff's δ / Cohen's d); FDR-adjusted."

